<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VIGAT mikroschemos ženklas">
  <defs>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main chip body with gradient -->
  <rect x="18" y="14" width="28" height="36" rx="3" fill="url(#chipGradient)"/>
  
  <!-- Inner detail -->
  <rect x="24" y="21" width="16" height="22" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Top vertical pins -->
  <line x1="23" y1="6" x2="23" y2="14" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="6" x2="32" y2="14" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="41" y1="6" x2="41" y2="14" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bottom vertical pins -->
  <line x1="23" y1="50" x2="23" y2="58" stroke="#004499" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="58" stroke="#004499" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="41" y1="50" x2="41" y2="58" stroke="#004499" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Left horizontal pins -->
  <line x1="10" y1="21" x2="18" y2="21" stroke="#004499" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="30" x2="18" y2="30" stroke="#004499" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="39" x2="18" y2="39" stroke="#004499" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right horizontal pins -->
  <line x1="46" y1="21" x2="54" y2="21" stroke="#0066cc" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="30" x2="54" y2="30" stroke="#0066cc" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="39" x2="54" y2="39" stroke="#0066cc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Connection dots -->
  <circle cx="10" cy="21" r="2.5" fill="#0066cc"/>
  <circle cx="54" cy="39" r="2.5" fill="#004499"/>
  <circle cx="10" cy="30" r="1.5" fill="#0066cc" opacity="0.6"/>
  <circle cx="10" cy="39" r="1.5" fill="#0066cc" opacity="0.6"/>
</svg>
